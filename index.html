<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine2 | Stream</title>
  <link rel="icon" href="https://img.icons8.com/emoji/48/clapper-board-emoji.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b0d14;
      --card-bg: #161922;
      --accent: #ffffff;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Floating Navigation Bar */
    nav {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(22, 25, 34, 0.75);
      backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-btn {
      color: var(--muted);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .nav-btn.active, .nav-btn:hover {
      background: #ffffff;
      color: #000000;
    }

    /* Floating Logo */
    .brand-logo {
      position: fixed;
      top: 25px;
      left: 30px;
      z-index: 1000;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }

    /* Hero Banner Section */
    .hero {
      position: relative;
      height: 80vh;
      width: 100%;
      background-size: cover;
      background-position: center top;
      display: flex;
      align-items: flex-end;
      padding: 60px 80px;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(11,13,20,0.2) 0%, rgba(11,13,20,0.8) 70%, var(--bg) 100%),
                  linear-gradient(90deg, rgba(11,13,20,0.9) 0%, rgba(11,13,20,0) 60%);
    }

    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 600px;
    }

    .hero-title {
      font-size: 3.8rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 15px;
    }

    .hero-desc {
      font-size: 0.95rem;
      color: #d1d5db;
      line-height: 1.5;
      margin-bottom: 25px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
    }

    .btn-play {
      background: #ffffff;
      color: #000000;
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* Content Rows */
    .section {
      padding: 20px 80px 40px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 15px;
      scroll-behavior: smooth;
    }

    .row::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 200px;
      border-radius: 16px;
      overflow: hidden;
      background: var(--card-bg);
      position: relative;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="brand-logo"><i class="fa-solid fa-clapperboard"></i></div>

  <nav>
    <a href="#" class="nav-btn active"><i class="fa-solid fa-house"></i> Home</a>
    <a href="#" class="nav-btn">Movies</a>
    <a href="#" class="nav-btn">Shows</a>
    <a href="#" class="nav-btn">My List</a>
  </nav>

  <div class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="hero-title">Loading...</h1>
      <div class="hero-meta" id="hero-meta"></div>
      <p class="hero-desc" id="hero-desc"></p>
      <div class="hero-actions">
        <button class="btn-play"><i class="fa-solid fa-play"></i> Play</button>
        <button class="btn-icon"><i class="fa-solid fa-plus"></i></button>
        <button class="btn-icon"><i class="fa-solid fa-circle-info"></i></button>
      </div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">Trending Movies</h2>
    <div class="row" id="trending-movies"></div>
  </div>

  <script>
    const API_KEY = 'a3677549461e9117a4628505903cbad9';

    async function init() {
      const res = await fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=${API_KEY}`);
      const data = await res.json();
      const movies = data.results;

      if (movies.length > 0) {
        setupHero(movies[0]);
        setupRow(movies, 'trending-movies');
      }
    }

    function setupHero(movie) {
      document.getElementById('hero').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${movie.backdrop_path})`;
      document.getElementById('hero-title').innerText = movie.title;
      document.getElementById('hero-meta').innerHTML = `
        <span>★ ${movie.vote_average.toFixed(1)}</span>
        <span>•</span>
        <span>${movie.release_date ? movie.release_date.split('-')[0] : ''}</span>
      `;
      document.getElementById('hero-desc').innerText = movie.overview;
    }

    function setupRow(items, elementId) {
      const container = document.getElementById(elementId);
      container.innerHTML = items.map(item => `
        <div class="card">
          <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${item.title}">
        </div>
      `).join('');
    }

    init();
  </script>
</body>
</html>
