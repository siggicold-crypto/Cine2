<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine2 | Stream</title>
  
  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="google68d6baa20255cd92">

  <!-- SEO & Search Engine Indexing -->
  <meta name="description" content="Cine2 - Stream your favorite trending movies and shows online.">
  <meta name="keywords" content="Cine2, Cine 2, stream movies, watch movies online">
  <meta name="robots" content="index, follow">

  <link rel="icon" href="https://img.icons8.com/color/48/film-reel.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg: #0b0d14;
      --card-bg: #161922;
      --accent: #ffffff;
      --accent-text: #000000;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    nav {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(22, 25, 34, 0.85);
      backdrop-filter: blur(16px);
      padding: 8px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-btn {
      color: var(--muted);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-btn.active, .nav-btn:hover {
      background: var(--accent);
      color: var(--accent-text);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.85rem;
      width: 140px;
      padding-left: 8px;
    }

    .brand-logo {
      position: fixed;
      top: 25px;
      left: 30px;
      z-index: 1000;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
    }

    .hero {
      position: relative;
      height: 75vh;
      width: 100%;
      background-size: cover;
      background-position: center top;
      display: flex;
      align-items: flex-end;
      padding: 60px 80px;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(11,13,20,0.2) 0%, rgba(11,13,20,0.8) 70%, var(--bg) 100%),
                  linear-gradient(90deg, rgba(11,13,20,0.9) 0%, rgba(11,13,20,0) 60%);
    }

    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 600px;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 15px;
    }

    .hero-desc {
      font-size: 0.95rem;
      color: #d1d5db;
      line-height: 1.5;
      margin-bottom: 25px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-play {
      background: var(--accent);
      color: var(--accent-text);
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s;
    }

    .btn-play:hover { transform: scale(1.05); }

    .section {
      padding: 20px 80px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .row {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding: 10px 0 20px;
      scroll-behavior: smooth;
    }

    .row::-webkit-scrollbar { height: 8px; }
    .row::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .card {
      flex: 0 0 180px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--card-bg);
      position: relative;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .card:hover { transform: translateY(-6px) scale(1.03); }

    .card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.95);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-content {
      width: 90%;
      max-width: 1000px;
      aspect-ratio: 16/9;
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .modal iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .server-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      width: 90%;
      max-width: 1000px;
      justify-content: space-between;
    }

    .server-select-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .server-select {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .settings-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      width: 320px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }

    .color-options {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .color-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }

    .color-dot:hover { transform: scale(1.15); }

    .close-modal {
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="brand-logo"><i class="fa-solid fa-clapperboard"></i></div>

  <nav>
    <a href="#" class="nav-btn active"><i class="fa-solid fa-house"></i> Home</a>
    <a href="#mylist-section" class="nav-btn"><i class="fa-solid fa-bookmark"></i> My List</a>
    <div class="nav-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i> Settings</div>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass" style="color: var(--muted); font-size: 0.8rem;"></i>
      <input type="text" id="searchInput" placeholder="Search movies..." oninput="handleSearch(event)">
    </div>
  </nav>

  <div class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="hero-title">Loading...</h1>
      <div class="hero-meta" id="hero-meta"></div>
      <p class="hero-desc" id="hero-desc"></p>
      <div class="hero-actions">
        <button class="btn-play" id="hero-play-btn"><i class="fa-solid fa-play"></i> Watch Movie</button>
      </div>
    </div>
  </div>

  <div class="section" id="mylist-section">
    <h2 class="section-title">📌 My List</h2>
    <div class="row" id="my-list-row"><p style="color: var(--muted);">No saved movies yet.</p></div>
  </div>

  <div class="section">
    <h2 class="section-title" id="row1-title">Trending Movies</h2>
    <div class="row" id="trending-movies"></div>
  </div>

  <div class="section">
    <h2 class="section-title">🎄 Christmas Classics</h2>
    <div class="row" id="christmas-movies"></div>
  </div>

  <div class="section">
    <h2 class="section-title">🎃 Halloween Favorites</h2>
    <div class="row" id="halloween-movies"></div>
  </div>

  <div class="modal" id="videoModal">
    <div class="server-controls">
      <div class="server-select-wrapper">
        <label for="serverSelect" style="font-size: 0.9rem; color: var(--muted);"><i class="fa-solid fa-server"></i> Server:</label>
        <select id="serverSelect" class="server-select" onchange="changeServer(this.value)">
          <option value="vidsrc_cc">Server 1 (VidSrc.cc)</option>
          <option value="vidsrc_me">Server 2 (VidSrc.me)</option>
          <option value="embed_su">Server 3 (Embed.su)</option>
          <option value="2embed">Server 4 (2Embed)</option>
          <option value="vidsrc_icu">Server 5 (VidSrc.icu)</option>
        </select>
      </div>
      <span class="close-modal" onclick="closeModal()">&times;</span>
    </div>
    <div class="modal-content">
      <iframe id="moviePlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="settings-card">
      <span class="close-modal" style="position: absolute; top: 10px; right: 15px;" onclick="closeSettings()">&times;</span>
      <h3>Accent Color</h3>
      <div class="color-options">
        <div class="color-dot" style="background: #ffffff;" onclick="changeColor('#ffffff', '#000000')"></div>
        <div class="color-dot" style="background: #e50914;" onclick="changeColor('#e50914', '#ffffff')"></div>
        <div class="color-dot" style="background: #0071e3;" onclick="changeColor('#0071e3', '#ffffff')"></div>
        <div class="color-dot" style="background: #10b981;" onclick="changeColor('#10b981', '#ffffff')"></div>
        <div class="color-dot" style="background: #8b5cf6;" onclick="changeColor('#8b5cf6', '#ffffff')"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://api.themoviedb.org/3';
    const READ_ACCESS_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJhMzY3NzU0OTQ2MWU5MTE3YTQ2Mjg1MDU5MDNjYmFkOSIsIm5iZiI6MTc4ODAzMDIwNC4zNjMwMDAyLCJzdWIiOiI2YTkzMmNmY2E2M2YzZmQ4NGI5Yjg4MjIiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.Q1Easi0KN3casKOIm-txCk7yKdt0KdK6AbLl97kqU18';

    let currentMovieId = null;

    const servers = {
      vidsrc_cc: id => `https://vidsrc.cc/v2/embed/movie/${id}`,
      vidsrc_me: id => `https://vidsrc.me/embed/movie?tmdb=${id}`,
      embed_su: id => `https://embed.su/embed/movie/${id}`,
      '2embed': id => `https://www.2embed.cc/embed/${id}`,
      vidsrc_icu: id => `https://vidsrc.icu/embed/movie/${id}`
    };

    const options = {
      method: 'GET',
      headers: {
        accept: 'application/json',
        Authorization: `Bearer ${READ_ACCESS_TOKEN}`
      }
    };

    async function init() {
      fetchCategory(`${API_URL}/trending/movie/day`, 'trending-movies', true);
      fetchCategory(`${API_URL}/search/movie?query=christmas`, 'christmas-movies');
      fetchCategory(`${API_URL}/search/movie?query=halloween`, 'halloween-movies');
    }

    async function fetchCategory(url, containerId, isTrending = false) {
      try {
        const res = await fetch(url, options);
        const data = await res.json();
        const container = document.getElementById(containerId);

        if (data.results && data.results.length > 0) {
          if (isTrending) setupHero(data.results[0]);
          renderRow(data.results, containerId);
        } else {
          container.innerHTML = '<p style="color: var(--muted);">No results found.</p>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    function setupHero(item) {
      document.getElementById('hero').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${item.backdrop_path})`;
      document.getElementById('hero-title').innerText = item.title;
      document.getElementById('hero-meta').innerHTML = `
        <span>★ ${(item.vote_average || 0).toFixed(1)}</span>
        <span>•</span>
        <span>${(item.release_date || '').split('-')[0]}</span>
      `;
      document.getElementById('hero-desc').innerText = item.overview || 'No description available.';
      document.getElementById('hero-play-btn').onclick = () => playMovie(item.id);
    }

    function renderRow(items, elementId) {
      const container = document.getElementById(elementId);
      const validItems = items.filter(i => i.poster_path);
      
      if (validItems.length === 0) {
        container.innerHTML = '<p style="color: var(--muted);">No posters available.</p>';
        return;
      }

      container.innerHTML = validItems.map(item => `
        <div class="card" onclick="playMovie(${item.id})">
          <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${item.title}">
        </div>
      `).join('');
    }

    function playMovie(id) {
      currentMovieId = id;
      const selectedServer = document.getElementById('serverSelect').value;
      document.getElementById('moviePlayer').src = servers[selectedServer](id);
      document.getElementById('videoModal').style.display = 'flex';
    }

    function changeServer(serverKey) {
      if (currentMovieId && servers[serverKey]) {
        document.getElementById('moviePlayer').src = servers[serverKey](currentMovieId);
      }
    }

    function closeModal() {
      document.getElementById('videoModal').style.display = 'none';
      document.getElementById('moviePlayer').src = '';
    }

    function openSettings() {
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function changeColor(accentColor, textColor) {
      document.documentElement.style.setProperty('--accent', accentColor);
      document.documentElement.style.setProperty('--accent-text', textColor);
      closeSettings();
    }

    function handleSearch(e) {
      const query = e.target.value.trim();
      if (query.length > 1) {
        document.getElementById('row1-title').innerText = `Results for "${query}"`;
        fetchCategory(`${API_URL}/search/movie?query=${encodeURIComponent(query)}`, 'trending-movies');
      } else if (query.length === 0) {
        document.getElementById('row1-title').innerText = 'Trending Movies';
        fetchCategory(`${API_URL}/trending/movie/day`, 'trending-movies');
      }
    }

    init();
  </script>
</body>
</html>
