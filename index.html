<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine2 | Stream Movies</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151922;
      --accent: #00e5ff;
      --accent-hover: #00b3cc;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 40px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(45deg, #00e5ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .search-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
    }

    input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 30px;
      border: 1px solid #2a2f3d;
      background: var(--card-bg);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    button {
      padding: 14px 28px;
      border-radius: 30px;
      border: none;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
    }

    .movie-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      border: 1px solid #2a2f3d;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
      border-color: #3b4254;
    }

    .card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
    }

    .card-info { padding: 15px; }

    .card h3 {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .rating {
      font-size: 0.85rem;
      color: #ffd700;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>Cine2</h1>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search movies...">
      <button onclick="searchMovies()">Search</button>
    </div>
  </header>

  <main id="movies" class="movie-grid">Loading top movies...</main>

  <script>
    const API_KEY = 'a3677549461e9117a4628505903cbad9';

    fetchMovies(`https://api.themoviedb.org/3/trending/movie/day?api_key=${API_KEY}`);

    function fetchMovies(url) {
      fetch(url)
        .then(res => res.json())
        .then(data => {
          const grid = document.getElementById('movies');
          grid.innerHTML = '';

          if (!data.results || data.results.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No movies found.</p>';
            return;
          }

          data.results.forEach(movie => {
            const poster = movie.poster_path 
              ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` 
              : 'https://via.placeholder.com/500x750?text=No+Poster';

            grid.innerHTML += `
              <div class="card">
                <img src="${poster}" alt="${movie.title}">
                <div class="card-info">
                  <h3>${movie.title}</h3>
                  <div class="rating">★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}</div>
                </div>
              </div>
            `;
          });
        })
        .catch(() => {
          document.getElementById('movies').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Failed to load content.</p>';
        });
    }

    function searchMovies() {
      const query = document.getElementById('searchInput').value;
      if (query.trim() !== '') {
        const searchURL = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
        fetchMovies(searchURL);
      }
    }
  </script>
</body>
</html>
