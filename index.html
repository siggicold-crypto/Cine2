<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine2 | Stream</title>
  <link rel="icon" href="https://img.icons8.com/color/48/film-reel.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b0d14;
      --card-bg: #161922;
      --accent: #ffffff;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Floating Navigation Bar with Search Input */
    nav {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(22, 25, 34, 0.85);
      backdrop-filter: blur(16px);
      padding: 8px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-btn {
      color: var(--muted);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-btn.active, .nav-btn:hover {
      background: #ffffff;
      color: #000000;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.85rem;
      width: 140px;
      padding-left: 8px;
    }

    /* Floating Logo */
    .brand-logo {
      position: fixed;
      top: 25px;
      left: 30px;
      z-index: 1000;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }

    /* Hero Banner Section */
    .hero {
      position: relative;
      height: 80vh;
      width: 100%;
      background-size: cover;
      background-position: center top;
      display: flex;
      align-items: flex-end;
      padding: 60px 80px;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(11,13,20,0.2) 0%, rgba(11,13,20,0.8) 70%, var(--bg) 100%),
                  linear-gradient(90deg, rgba(11,13,20,0.9) 0%, rgba(11,13,20,0) 60%);
    }

    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 600px;
    }

    .hero-title {
      font-size: 3.8rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 15px;
    }

    .hero-desc {
      font-size: 0.95rem;
      color: #d1d5db;
      line-height: 1.5;
      margin-bottom: 25px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
    }

    .btn-play {
      background: #ffffff;
      color: #000000;
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s;
    }

    .btn-play:hover { transform: scale(1.05); }

    /* Content Rows */
    .section {
      padding: 20px 80px 40px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 15px;
      scroll-behavior: smooth;
    }

    .row::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 200px;
      border-radius: 16px;
      overflow: hidden;
      background: var(--card-bg);
      position: relative;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    /* Video Trailer Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 80%;
      max-width: 900px;
      aspect-ratio: 16/9;
      position: relative;
    }

    .modal iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }

    .close-modal {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="brand-logo"><i class="fa-solid fa-clapperboard"></i></div>

  <nav>
    <a href="#" class="nav-btn active"><i class="fa-solid fa-house"></i> Home</a>
    <a href="#" class="nav-btn">Movies</a>
    <a href="#" class="nav-btn">Shows</a>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass" style="color: var(--muted); font-size: 0.8rem;"></i>
      <input type="text" id="searchInput" placeholder="Search..." onkeyup="handleSearch(event)">
    </div>
  </nav>

  <div class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="hero-title">Loading...</h1>
      <div class="hero-meta" id="hero-meta"></div>
      <p class="hero-desc" id="hero-desc"></p>
      <div class="hero-actions">
        <button class="btn-play" id="hero-play-btn"><i class="fa-solid fa-play"></i> Watch Trailer</button>
      </div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title" id="row1-title">Trending Movies</h2>
    <div class="row" id="trending-movies"></div>
  </div>

  <div class="section">
    <h2 class="section-title">Trending Series</h2>
    <div class="row" id="trending-series"></div>
  </div>

  <!-- Video Modal Player -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <iframe id="trailerPlayer" src="" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const API_KEY = 'a3677549461e9117a4628505903cbad9';

    async function init() {
      fetchMovies();
      fetchSeries();
    }

    async function fetchMovies() {
      const res = await fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=${API_KEY}`);
      const data = await res.json();
      if (data.results.length > 0) {
        setupHero(data.results[0]);
        renderRow(data.results, 'trending-movies', 'movie');
      }
    }

    async function fetchSeries() {
      const res = await fetch(`https://api.themoviedb.org/3/trending/tv/day?api_key=${API_KEY}`);
      const data = await res.json();
      if (data.results.length > 0) {
        renderRow(data.results, 'trending-series', 'tv');
      }
    }

    function setupHero(item) {
      document.getElementById('hero').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${item.backdrop_path})`;
      document.getElementById('hero-title').innerText = item.title || item.name;
      document.getElementById('hero-meta').innerHTML = `
        <span>★ ${item.vote_average.toFixed(1)}</span>
        <span>•</span>
        <span>${(item.release_date || item.first_air_date || '').split('-')[0]}</span>
      `;
      document.getElementById('hero-desc').innerText = item.overview;
      document.getElementById('hero-play-btn').onclick = () => openTrailer('movie', item.id);
    }

    function renderRow(items, elementId, type) {
      const container = document.getElementById(elementId);
      container.innerHTML = items.map(item => `
        <div class="card" onclick="openTrailer('${type}', ${item.id})">
          <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${item.title || item.name}">
        </div>
      `).join('');
    }

    async function openTrailer(type, id) {
      const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}/videos?api_key=${API_KEY}`);
      const data = await res.json();
      const trailer = data.results.find(v => v.type === 'Trailer') || data.results[0];
      
      if (trailer) {
        document.getElementById('trailerPlayer').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
        document.getElementById('videoModal').style.display = 'flex';
      } else {
        alert('Trailer not available for this title.');
      }
    }

    function closeModal() {
      document.getElementById('videoModal').style.display = 'none';
      document.getElementById('trailerPlayer').src = '';
    }

    async function handleSearch(e) {
      const query = e.target.value.trim();
      if (query.length > 2) {
        document.getElementById('row1-title').innerText = `Results for "${query}"`;
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        renderRow(data.results.filter(i => i.poster_path), 'trending-movies', 'movie');
      } else if (query.length === 0) {
        document.getElementById('row1-title').innerText = 'Trending Movies';
        fetchMovies();
      }
    }

    init();
  </script>
</body>
</html>
